name: parkmate

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parkmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parkmate}
      POSTGRES_DB: ${POSTGRES_DB:-parkmate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parkmate} -d ${POSTGRES_DB:-parkmate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://parkmate:parkmate@postgres:5432/parkmate}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  ml-worker:
    build:
      context: ./ml
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    volumes:
      - ml_data:/app/data
      - ml_outputs:/app/outputs
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./devops/nginx/parkmate.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  ml_data:
  ml_outputs:
