name: Progress Report Automation

on:
  schedule:
    # Every Thursday at 11:59 PM IST (18:29 UTC)
    - cron: "29 18 * * 4"

  workflow_dispatch:
    inputs:
      report_type:
        description: "Select the report to generate"
        required: true
        type: choice
        options:
          - weekly
          - final
          - both
        default: weekly

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository with complete Git history
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Install dependencies
      - name: Install Dependencies
        run: |
          pip install reportlab matplotlib pypdf

      # Generate weekly report
      - name: Generate Weekly Report
        if: github.event_name == 'schedule' || inputs.report_type == 'weekly' || inputs.report_type == 'both'
        run: |
          python generate_report.py weekly

          mkdir -p weekly_reports

          mv *_Weekly_Progress_Report_Form-3_*.pdf weekly_reports/

      # Generate consolidated final report
      - name: Generate Final Report
        if: github.event_name == 'workflow_dispatch' && (inputs.report_type == 'final' || inputs.report_type == 'both')
        run: |
          python generate_final_report.py

      # Commit and push generated reports
      - name: Commit and Push Reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add weekly_reports/ final_reports/

          if git diff --staged --quiet; then
            echo "No new reports to commit."
          else
            git commit -m "docs: archive progress reports [skip ci]"
            git push
          fi
