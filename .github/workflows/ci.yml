name: ParkMate CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint-build:
    name: Lint and build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend-test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      APP_ENV: test
      PYTHONPATH: ${{ github.workspace }}/Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate database migration SQL
        env:
          DATABASE_URL: postgresql+psycopg2://parkmate:ci-only@localhost:5432/parkmate
          JWT_SECRET_KEY: ci-only-not-for-deployment
        run: alembic upgrade --sql head > /tmp/parkmate-migration.sql
      - name: Run backend contract tests
        run: python -m unittest discover -s tests -v

  celery-lint:
    name: Lint Celery worker package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    env:
      REDIS_URL: redis://localhost:6379/0
      PYTHONPATH: ${{ github.workspace }}/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML / Celery dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Celery package
        run: python -m compileall -q .
      - name: Import Celery app
        run: python -c "from scheduler.celery_app import app; print(app.main)"

  docker-build:
    name: Validate Compose and build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: |
          python devops/scripts/parkmate_ops.py init-env
          trap 'rm -f .env' EXIT
          docker compose config -q
      - name: Build backend image
        run: docker build -t parkmate-backend ./Backend
      - name: Build frontend image
        run: docker build -t parkmate-frontend ./frontend
      - name: Build Celery / ML worker image
        run: docker build -t parkmate-celery ./ml
      - name: Build Redis image
        run: docker build -t parkmate-redis ./devops/redis
      - name: Smoke-test a clean Compose stack
        run: |
          python devops/scripts/parkmate_ops.py init-env
          trap 'docker compose down -v; rm -f .env' EXIT
          docker compose up --build -d --wait --wait-timeout 240
          email="ci-smoke-${GITHUB_RUN_ID}@example.com"
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "{\"name\":\"CI Smoke\",\"email\":\"${email}\",\"phone_no\":\"9991234567\",\"password\":\"SmokeOnly-123!\",\"city\":\"Jaipur\",\"state\":\"Rajasthan\",\"country\":\"IN\",\"location_permission_granted\":true,\"latitude\":26.9124,\"longitude\":75.7873}" \
            http://localhost/auth/registration
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"${email}\",\"password\":\"SmokeOnly-123!\"}" \
            http://localhost/auth/userlogin |
            python -c 'import json,sys; result=json.load(sys.stdin); assert result.get("access_token") and result.get("refresh_token")'
          curl --fail --silent --show-error http://localhost/ready |
            python -c 'import json,sys; result=json.load(sys.stdin); assert result["status"] == "ready" and result["database_connected"] and result["redis_connected"]'
