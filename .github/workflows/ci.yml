name: ParkMate CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint-build:
    name: Lint and build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend-test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      APP_ENV: test
      PYTHONPATH: ${{ github.workspace }}/Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run backend contract tests
        run: python -m unittest discover -s tests -v

  celery-lint:
    name: Lint Celery worker package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    env:
      REDIS_URL: redis://localhost:6379/0
      PYTHONPATH: ${{ github.workspace }}/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML / Celery dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Celery package
        run: python -m compileall -q .
      - name: Import Celery app
        run: python -c "from scheduler.celery_app import app; print(app.main)"

  docker-build:
    name: Validate Compose and build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config -q
      - name: Build backend image
        run: docker build -t parkmate-backend ./Backend
      - name: Build frontend image
        run: docker build -t parkmate-frontend ./frontend
      - name: Build Celery / ML worker image
        run: docker build -t parkmate-celery ./ml
      - name: Build Redis image
        run: docker build -t parkmate-redis ./devops/redis
