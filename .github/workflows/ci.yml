name: ParkMate CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config -q
      - name: Build backend image
        run: docker build -t parkmate-backend ./Backend
      - name: Build frontend image
        run: docker build -t parkmate-frontend ./frontend
      - name: Build ML worker image
        run: docker build -t parkmate-ml ./ml
